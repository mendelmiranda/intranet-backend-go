services:
  usuarios-service:
    build:
      context: .
      args:
        SERVICE: usuarios-service
    environment:
      PORT: 8081
    ports:
      - "8081:8081"
    restart: unless-stopped

  ferias-service:
    build:
      context: .
      args:
        SERVICE: ferias-service
    environment:
      PORT: 8082
    ports:
      - "8082:8082"
    restart: unless-stopped

  servidor-service:
    build:
      context: .
      args:
        SERVICE: servidor-service
    environment:
      PORT: 8083
    ports:
      - "8083:8083"
    restart: unless-stopped

  contracheque-service:
    build:
      context: .
      args:
        SERVICE: contracheque-service
    env_file:
      - .env
    environment:
      PORT: 8084
    ports:
      - "8084:8084"
    restart: unless-stopped
